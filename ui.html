<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNG-MERCURY</title><style>
:root{--bg:#0b1020;--panel:#131a2d;--line:#27314d;--text:#eef3ff;--muted:#98a6c7;--ok:#2bd576;--warn:#ffb84d;--bad:#ff5d73;--accent:#5aa8ff}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(180deg,#09101d,#10182a);color:var(--text)}header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);background:#0d1425;position:sticky;top:0;z-index:5}.brand{font-weight:800;letter-spacing:.08em}.sub{font-size:12px;color:var(--muted)}.status{display:flex;gap:8px;align-items:center;font-size:13px}.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 14px var(--ok)}main{max-width:1200px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 14px 30px #0003}.panel h2{margin:0 0 14px;font-size:18px}.scanbox{border:2px dashed #3c4b70;border-radius:18px;padding:22px;background:#0e1526}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}input,select{width:100%;padding:14px;border-radius:12px;border:1px solid #34405f;background:#0a1120;color:var(--text);font-size:16px;outline:none}input:focus,select:focus{border-color:var(--accent)}button{border:0;border-radius:12px;padding:14px 16px;font-weight:800;cursor:pointer;background:var(--accent);color:#06101f;font-size:15px}button.secondary{background:#222d46;color:var(--text)}button.warn{background:var(--warn);color:#241600}button.good{background:var(--ok);color:#062112}.actions{display:flex;gap:10px;flex-wrap:wrap}.result{margin-top:14px;padding:14px;border-radius:14px;background:#0a1120;border:1px solid var(--line);min-height:120px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.kpi{padding:14px;border:1px solid var(--line);border-radius:14px;background:#0a1120}.kpi b{display:block;font-size:22px}.kpi span{font-size:11px;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{color:var(--muted)}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#1d2942;color:#bcd4ff;font-size:11px}.review-item{padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#0a1120}.review-item strong{display:block}.review-meta{font-size:12px;color:var(--muted);margin:5px 0 10px}.empty{color:var(--muted);font-size:13px;padding:12px 0}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{padding:9px 12px;background:#1a243b;color:#cbd8f3}.tabs button.active{background:var(--accent);color:#08111f}@media(max-width:820px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr 1fr}header{padding:14px}main{padding:14px}.actions button{flex:1}.panel{padding:14px}}
</style></head><body>
<header><div><div class="brand">UNG-MERCURY</div><div class="sub">Package Intake & Sorting Station</div></div><div class="status"><span class="dot"></span><span id="svc">Checking service…</span></div></header>
<main><div class="kpis"><div class="kpi"><b id="count">0</b><span>Captured this session</span></div><div class="kpi"><b id="dupes">0</b><span>Duplicates blocked</span></div><div class="kpi"><b id="reviews">0</b><span>Open reviews</span></div></div>
<div class="grid"><section class="panel"><div class="tabs"><button id="barcodeTab" class="active" onclick="setMode('barcode')">Barcode Scan</button><button id="manualTab" onclick="setMode('manual')">Manual Entry</button></div><div class="scanbox"><h2 id="modeTitle">Scan Package</h2><div class="field"><label>Tracking Number</label><input id="tracking" autocomplete="off" placeholder="Scan or enter tracking number"></div><div id="manualOnly" style="display:none" class="row"><div class="field"><label>Destination Code</label><input id="destination" placeholder="UG-…"></div><div class="field"><label>Destination Type</label><select id="destinationType"><option value="grid">Grid / ZIPPER</option><option value="facility">Facility</option><option value="regional_center">Regional Center</option></select></div></div><div class="row"><div class="field"><label>Weight (kg)</label><input id="weight" inputmode="decimal" placeholder="0.0"></div><div class="field"><label>Station</label><input id="station" value="STN-001"></div></div><div class="row"><div class="field"><label>Device</label><input id="device" value="SCANNER-01"></div><div class="field"><label>Operator</label><input id="operator" value="OP-001"></div></div><div class="actions"><button class="good" onclick="submitCapture()">Process Package</button><button class="secondary" onclick="clearForm()">Clear</button></div><div class="result" id="result"><span class="empty">Ready for first package.</span></div></div></section>
<section class="panel"><h2>Manual Review Queue</h2><div class="actions" style="margin-bottom:12px"><button class="secondary" onclick="loadReviews()">Refresh Queue</button></div><div id="reviewList"><div class="empty">Loading reviews…</div></div></section></div>
<section class="panel" style="margin-top:18px"><h2>Recent Packages</h2><div style="overflow:auto"><table><thead><tr><th>Tracking</th><th>Weight</th><th>Method</th><th>Status</th><th>Capture ID</th></tr></thead><tbody id="recent"><tr><td colspan="5" class="empty">No packages captured in this session.</td></tr></tbody></table></div></section></main>
<script>
let mode='barcode',captures=0,dupes=0,recent=[];const $=id=>document.getElementById(id);function setMode(m){mode=m;$('barcodeTab').classList.toggle('active',m==='barcode');$('manualTab').classList.toggle('active',m==='manual');$('manualOnly').style.display=m==='manual'?'grid':'none';$('modeTitle').textContent=m==='barcode'?'Scan Package':'Manual Package Entry';$('tracking').focus()}function idKey(){return 'mercury-'+Date.now()+'-'+Math.random().toString(16).slice(2)}async function submitCapture(){const body={tracking_number:$('tracking').value.trim()||null,weight_kg:$('weight').value?Number($('weight').value):null,station_id:$('station').value.trim(),device_id:$('device').value.trim(),operator_id:$('operator').value.trim()};if(mode==='manual'){body.destination_code=$('destination').value.trim()||null;body.destination_type=$('destinationType').value}const key=idKey();try{const r=await fetch('/v1/captures/'+mode,{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':key},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(Array.isArray(j.detail)?j.detail.map(x=>x.msg).join(', '):j.detail||'Capture failed');captures++;if(j.duplicate)dupes++;$('count').textContent=captures;$('dupes').textContent=dupes;const c=j.capture||{};$('result').innerHTML='<b>Accepted</b><br><span class="pill">'+(j.duplicate?'Duplicate blocked':'New capture')+'</span><p><b>Tracking:</b> '+(c.tracking_number||'—')+'<br><b>Capture ID:</b> '+(c.capture_id||'—')+'<br><b>APEX demand:</b> '+(j.apex_demand??'—')+'</p>';recent.unshift({tracking:c.tracking_number||'—',weight:c.weight_kg??'—',method:c.capture_method||mode,status:j.duplicate?'Duplicate':'Accepted',id:c.capture_id||'—'});renderRecent();if(mode==='manual')loadReviews();$('tracking').value='';$('weight').value='';$('tracking').focus()}catch(e){$('result').innerHTML='<b style="color:var(--bad)">Rejected</b><p>'+e.message+'</p>'}}function clearForm(){$('tracking').value='';$('weight').value='';$('destination').value='';$('result').innerHTML='<span class="empty">Ready.</span>';$('tracking').focus()}function renderRecent(){const t=$('recent');t.innerHTML=recent.slice(0,20).map(x=>'<tr><td>'+x.tracking+'</td><td>'+x.weight+'</td><td>'+x.method+'</td><td><span class="pill">'+x.status+'</span></td><td>'+x.id.slice(0,12)+'…</td></tr>').join('')||'<tr><td colspan="5">No packages</td></tr>'}async function loadReviews(){try{const r=await fetch('/v1/manual-review?status=open&limit=50');const j=await r.json();const rows=j.results||[];$('reviews').textContent=rows.length;$('reviewList').innerHTML=rows.length?rows.map(x=>'<div class="review-item"><strong>'+(JSON.parse(x.payload_json||'{}').tracking_number||x.capture_id)+'</strong><div class="review-meta">Review '+x.review_id.slice(0,8)+' · '+x.reason+'</div><div class="actions"><button class="secondary" onclick="claimReview(\''+x.review_id+'\')">Claim</button><button class="good" onclick="resolveReview(\''+x.review_id+'\')">Approve</button></div></div>').join(''):'<div class="empty">No open reviews.</div>'}catch(e){$('reviewList').innerHTML='<div class="empty">Review queue unavailable.</div>'}}async function claimReview(id){await fetch('/v1/manual-review/'+id+'/claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({operator_id:$('operator').value.trim()})});loadReviews()}async function resolveReview(id){await fetch('/v1/manual-review/'+id+'/resolve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({operator_id:$('operator').value.trim(),resolution:'approved'})});loadReviews()}async function health(){try{const r=await fetch('/health');const j=await r.json();$('svc').textContent=j.status==='ok'?'Online · v'+j.version:'Service issue'}catch(e){$('svc').textContent='Offline'}}health();loadReviews();$('tracking').focus();
</script></body></html>
