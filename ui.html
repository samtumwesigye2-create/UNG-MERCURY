<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNG-MERCURY</title><style>:root{--bg:#0b1020;--panel:#131a2d;--line:#27314d;--text:#eef3ff;--muted:#98a6c7;--ok:#2bd576;--warn:#ffb84d;--bad:#ff5d73;--accent:#5aa8ff}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(180deg,#09101d,#10182a);color:var(--text)}header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);background:#0d1425}.brand{font-weight:800;letter-spacing:.08em}.sub,label,.empty{color:var(--muted)}main{max-width:1200px;margin:auto;padding:20px}.kpis,.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.panel,.kpi{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}.kpi b{display:block;font-size:22px}.scanbox{border:2px dashed #3c4b70;border-radius:18px;padding:22px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}label{font-size:12px;font-weight:700;text-transform:uppercase}input,select{padding:14px;border-radius:12px;border:1px solid #34405f;background:#0a1120;color:var(--text);font-size:16px}button{border:0;border-radius:12px;padding:14px 16px;font-weight:800;background:var(--accent);color:#06101f}.secondary{background:#222d46;color:var(--text)}.good{background:var(--ok)}.actions,.tabs{display:flex;gap:10px}.result,.dest{margin-top:12px;padding:14px;border-radius:14px;background:#0a1120;border:1px solid var(--line)}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#1d2942;color:#bcd4ff;font-size:11px}.review-item{padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0}.active{background:var(--accent)!important;color:#08111f!important}.tabs button{background:#1a243b;color:#cbd8f3}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}@media(max-width:820px){.grid,.row{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}main{padding:14px}.actions button{flex:1}}</style></head><body><header><div><div class="brand">UNG-MERCURY</div><div class="sub">Package Intake & Sorting Station</div></div><div>● <span id="svc">Checking…</span></div></header><main><div class="kpis"><div class="kpi"><b id="count">0</b><span>Captured</span></div><div class="kpi"><b id="dupes">0</b><span>Duplicates</span></div><div class="kpi"><b id="reviews">0</b><span>Reviews</span></div></div><div class="grid" style="margin-top:16px"><section class="panel"><div class="tabs"><button id="barcodeTab" class="active" onclick="setMode('barcode')">Barcode Scan</button><button id="manualTab" onclick="setMode('manual')">Manual Entry</button></div><div class="scanbox"><h2 id="modeTitle">Scan Package</h2><div class="field"><label>Tracking Number</label><input id="tracking" placeholder="Scan or enter tracking number"></div><div id="manualOnly" style="display:none"><div class="row" style="grid-template-columns:2fr 1fr"><div class="field"><label>Destination ZIPPER</label><input id="destination" inputmode="numeric" maxlength="5" placeholder="5-digit ZIPPER" oninput="lookupDestination()"></div><div class="field"><label>Destination Type</label><select id="destinationType"><option value="grid">Grid / ZIPPER</option><option value="facility">Facility</option><option value="regional_center">Regional Center</option></select></div></div><div id="destResult" class="dest empty">Enter a ZIPPER to validate against the live registry.</div></div><div class="row"><div class="field"><label>Weight (kg)</label><input id="weight" inputmode="decimal" placeholder="0.0"></div><div class="field"><label>Station</label><input id="station" value="STN-001"></div><div class="field"><label>Device</label><input id="device" value="SCANNER-01"></div></div><div class="field"><label>Operator</label><input id="operator" value="OP-001"></div><div class="actions"><button class="good" onclick="submitCapture()">Process Package</button><button class="secondary" onclick="clearForm()">Clear</button></div><div class="result" id="result"><span class="empty">Ready for first package.</span></div></div></section><section class="panel"><h2>Manual Review Queue</h2><button class="secondary" onclick="loadReviews()">Refresh Queue</button><div id="reviewList"></div></section></div><section class="panel" style="margin-top:18px"><h2>Recent Packages</h2><div style="overflow:auto"><table><thead><tr><th>Tracking</th><th>Weight</th><th>Method</th><th>Status</th><th>Capture ID</th></tr></thead><tbody id="recent"><tr><td colspan="5" class="empty">No packages yet.</td></tr></tbody></table></div></section></main><script>let mode='barcode',captures=0,dupes=0,recent=[],zipperValid=false,timer;const $=id=>document.getElementById(id);function setMode(m){mode=m;$('barcodeTab').classList.toggle('active',m==='barcode');$('manualTab').classList.toggle('active',m==='manual');$('manualOnly').style.display=m==='manual'?'block':'none';$('modeTitle').textContent=m==='barcode'?'Scan Package':'Manual Package Entry'}function idKey(){return'mercury-'+Date.now()+'-'+Math.random().toString(16).slice(2)}function lookupDestination(){clearTimeout(timer);zipperValid=false;const c=$('destination').value.trim();$('destResult').textContent='Checking ZIPPER…';if(!c){$('destResult').textContent='Enter a ZIPPER to validate against the live registry.';return}timer=setTimeout(async()=>{try{const r=await fetch('/v1/destinations/'+encodeURIComponent(c)),j=await r.json();if(!r.ok)throw 0;zipperValid=true;const d=j.destination||{};$('destResult').innerHTML='<b style="color:var(--ok)">✓ Live ZIPPER verified: '+j.code+'</b><br>'+(d.district||d.name||'Assigned destination')+(d.area_type?' · '+d.area_type:'')}catch(e){$('destResult').innerHTML='<b style="color:var(--bad)">✕ ZIPPER not assigned / unavailable</b>'}},350)}async function submitCapture(){if(mode==='manual'&&$('destinationType').value==='grid'&&!zipperValid){$('result').innerHTML='<b style="color:var(--bad)">Rejected</b><p>Validate a live ZIPPER destination first.</p>';return}const body={tracking_number:$('tracking').value.trim()||null,weight_kg:$('weight').value?Number($('weight').value):null,station_id:$('station').value.trim(),device_id:$('device').value.trim(),operator_id:$('operator').value.trim()};if(mode==='manual'){body.destination_code=$('destination').value.trim()||null;body.destination_type=$('destinationType').value}try{const r=await fetch('/v1/captures/'+mode,{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':idKey()},body:JSON.stringify(body)}),j=await r.json();if(!r.ok)throw new Error(typeof j.detail==='string'?j.detail:JSON.stringify(j.detail));captures++;if(j.duplicate)dupes++;$('count').textContent=captures;$('dupes').textContent=dupes;const c=j.capture||{},z=j.zipper?.destination;$('result').innerHTML='<b style="color:var(--ok)">Accepted</b><br><span class="pill">'+(j.duplicate?'Duplicate blocked':'New capture')+'</span><p><b>Tracking:</b> '+(c.tracking_number||'—')+'<br><b>Destination:</b> '+(z?.code||c.destination_code||'—')+(z?.district?' · '+z.district:'')+'<br><b>APEX demand:</b> '+(j.apex_demand??'—')+'</p>';recent.unshift({tracking:c.tracking_number||'—',weight:c.weight_kg??'—',method:c.capture_method||mode,status:j.duplicate?'Duplicate':'Accepted',id:c.capture_id||'—'});renderRecent();if(mode==='manual')loadReviews()}catch(e){$('result').innerHTML='<b style="color:var(--bad)">Rejected</b><p>'+e.message+'</p>'}}function clearForm(){$('tracking').value='';$('weight').value='';$('destination').value='';zipperValid=false;$('destResult').textContent='Enter a ZIPPER to validate against the live registry.'}function renderRecent(){$('recent').innerHTML=recent.slice(0,20).map(x=>'<tr><td>'+x.tracking+'</td><td>'+x.weight+'</td><td>'+x.method+'</td><td>'+x.status+'</td><td>'+x.id.slice(0,12)+'…</td></tr>').join('')}async function loadReviews(){try{const r=await fetch('/v1/manual-review?status=open&limit=50'),j=await r.json(),rows=j.results||[];$('reviews').textContent=rows.length;$('reviewList').innerHTML=rows.length?rows.map(x=>'<div class="review-item"><b>'+x.capture_id+'</b><br>'+x.reason+'</div>').join(''):'<div class="empty">No open reviews.</div>'}catch(e){}}async function health(){try{const r=await fetch('/ready'),j=await r.json();$('svc').textContent='Online · v0.3.0 · ZIPPER '+(j.zipper==='connected'?'Live':'Degraded')}catch(e){$('svc').textContent='Offline'}}health();loadReviews();</script></body></html>
